<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Witness</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
  opacity: 0;
  animation: fadeIn 1s forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
  }
}
      #witness-page {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        z-index: 10;
        pointer-events: all;
      }
      #witness-message {
        font-family: Georgia, serif;
        font-size: 22px;
        color: rgba(200, 235, 255, 0.9);
        text-align: center;
        letter-spacing: 0.1em;
        line-height: 1.8;
        max-width: 500px;
        padding: 0 40px;
        text-shadow:
          0 0 20px rgba(120, 200, 255, 0.4),
          0 0 40px rgba(120, 200, 255, 0.2);
        transition: opacity 1.5s ease;
      }
      #witness-action {
        pointer-events: all;
        background: transparent;
        border: 0.5px solid rgba(100, 180, 255, 0.4);
        border-radius: 40px;
        padding: 12px 40px;
        font-family: Georgia, serif;
        font-size: 13px;
        letter-spacing: 0.18em;
        color: rgba(160, 220, 255, 0.8);
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.4s;
      }
      #witness-action:hover {
        background: rgba(100, 180, 255, 0.08);
        border-color: rgba(140, 210, 255, 0.7);
        color: rgba(200, 235, 255, 1);
        letter-spacing: 0.22em;
      }
      #witness-hint {
        font-family: Georgia, serif;
        font-size: 11px;
        color: rgba(100, 160, 220, 0.5);
        letter-spacing: 0.08em;
        font-style: italic;
        pointer-events: none;
        transition: opacity 1s ease;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <a href="index.html" class="nav">✦ Back ✦</a>
    <div id="witness-page">
      <div id="witness-message"></div>
      <button id="witness-action">✦ Witness ✦</button>
      <span id="witness-hint">click to acknowledge this feeling</span>
    </div>
    <input id="text-input-entry" style="display:none" />
    <button id="release-btn" style="display:none"></button>
    <div id="tooltip" style="display:none"></div>
    <script src="https://www.gstatic.com/firebasejs/8.2.3/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.3/firebase-firestore.js"></script>
    <script src="script.js"></script>
    <script>
      const msg = localStorage.getItem('witnessMessage');
      const witnessMessage = document.getElementById('witness-message');
      const witnessAction = document.getElementById('witness-action');
      const witnessHint = document.getElementById('witness-hint');

      if (msg) {
        witnessMessage.textContent = msg;
      } else {
        witnessMessage.textContent = 'something left unsaid';
      }

      witnessAction.addEventListener('click', function() {
        // 存储已被见证，回去后让对应星星变亮
        localStorage.setItem('witnessedMessage', msg);

        // 文字淡出
        witnessMessage.style.opacity = '0';
        witnessHint.style.opacity = '0';
        witnessAction.style.opacity = '0';
        witnessAction.style.pointerEvents = 'none';

        // 1.5秒后返回
        setTimeout(function() {
          window.location.href = 'index.html';
        }, 1800);
      });
    </script>
  </body>
</html>
